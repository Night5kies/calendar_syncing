services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    environment:
      LOCAL_DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      LOCAL_REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code

  worker:
    build: .
    env_file: .env
    environment:
      LOCAL_DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      LOCAL_REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO
    volumes:
      - .:/code

volumes:
  pgdata:
